settings:
  economy:
    enabled: true
    creation_price: 100000.0
    set_home_price: 1000.0
    set_armor_price: 5000.0
    set_tag_price: 5000.0
    set_banner_price: 25000.0
    membership_price: 100.0
    alliance_price: 1000.0
  clean_up:
    enabled: false
    archive_days: 30
    delete_days: 45
  chat:
    ping_sound: "block.note_block.harp"
    ping_volume: 1.0
    ping_pitch: 1.0
  clan:
    # The amount of days a leader must be offline for an officer to takeover.
    takeover_days_threshold: 50
    # The amount of days a player who doesn't log in would be considered inactive.
    inactive_days_threshold: 4
    # The amount of active members a clan must have to be considered itself active.
    active_members_requirement: 4
    invite_timeout: 30
    teleport_delay_seconds: 4
    rally_cooldown_seconds: 60
    min_tag_size: 3
    max_tag_size: 5
    max_members: 30
  display:
    # Shared across all displays.
    # Mannequin size.
    scale: 0.6
    # Show the decorative hopper pedestal under each mannequin.
    base: true
    # Blocks above the anchor block to place the clan's wall banner.
    banner-height: 3
    # Wall sign wood type.
    sign_type: SPRUCE

    # Row of the top active clans, filled in active-member order. Extra active clans beyond
    # 'count' are not shown; the row extends to the viewer's RIGHT from the anchor block.
    active:
      enabled: true
      # First anchor block (a slab is recommended).
      anchor-block: [0, 0, 0]
      # Direction the mannequins / signs / banners face (toward viewers).
      facing: NORTH
      # Max display slots.
      count: 10
      # Empty blocks between each display (0 = adjacent).
      spacing: 0
      # Sign lines (MiniMessage). Placeholders: <tag>, <leader>, <active>.
      sign:
        line-1: "<white><tag>"
        line-2: ""
        line-3: "<white><leader>"
        line-4: "<gray>Active: <#7FD47F><active>"

    # Single mannequin showing the newest clan created.
    latest:
      enabled: true
      anchor-block: [0, 0, 0]
      facing: NORTH
      sign:
        line-1: "<white><tag>"
        line-2: ""
        line-3: "<white><leader>"
        line-4: "<#FFEB8B>Newest Clan"

    # Single mannequin showing an inactive clan; advance with /clan cycle (op).
    inactive:
      enabled: true
      anchor-block: [0, 0, 0]
      facing: NORTH
      sign:
        line-1: "<white><tag>"
        line-2: ""
        line-3: "<white><leader>"
        line-4: "<gray>Inactive"
  indicators:
    officer: "◂ "
    leader: "▸ "
  mysql:
    enabled: true
    username: ''
    # set for pterodactyl usage
    host: ''
    port: 3306
    password: ''
    database: ''
  deny_tags:
    - "admin"
    - "zerek"
    - "mwcks"
    - "mawks"
    - "mawck"
    - "mods"
    - "mod"
    - "donor"
    - "admln"
    - "adnin"
    - "admim"
    - "adnim"
page-formats:
  lines-per-page: 8
