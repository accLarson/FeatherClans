import net.schmizz.sshj.SSHClient
import net.schmizz.sshj.transport.verification.PromiscuousVerifier
import net.schmizz.sshj.xfer.FileSystemFile

buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'com.hierynomus:sshj:0.38.0'
    }
}

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'dev.zerek'
version = '3.13.1'

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

compileJava {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        name = 'sonatype'
        url = uri('https://oss.sonatype.org/content/groups/public/')
    }
    maven {
        name = 'placeholderapi'
        url = uri('https://repo.extendedclip.com/releases/')
    }
    maven {
        name = 'jitpack'
        url = uri('https://jitpack.io')
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'net.kyori:adventure-text-minimessage:4.17.0'

    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'com.zaxxer:HikariCP:6.2.1'
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(project: [version: project.version])
    }
}

shadowJar {
    archiveClassifier.set('')
    minimize()
    relocate 'com.zaxxer', 'dev.zerek.featherclans.libs'
    exclude 'META-INF/*.MF'
}

jar {
    enabled = false
}

tasks.assemble.dependsOn tasks.shadowJar

tasks.register('buildToF64Dev') {
    group = 'build'
    description = 'Build the plugin and upload it to the dev SFTP server.'
    dependsOn shadowJar

    def host = providers.gradleProperty('devHost')
    def port = providers.gradleProperty('devPort').orElse('22')
    def user = providers.gradleProperty('devUser')
    def password = providers.gradleProperty('devPassword')
    def remoteDir = providers.gradleProperty('devRemoteDir').orElse('plugins')
    def jarProvider = shadowJar.archiveFile

    doLast {
        def jarFile = jarProvider.get().asFile
        def remotePath = "${remoteDir.get().replaceAll('/$', '')}/${jarFile.name}"

        new SSHClient().withCloseable { ssh ->
            ssh.addHostKeyVerifier(new PromiscuousVerifier())
            ssh.connect(host.get(), port.get().toInteger())
            ssh.authPassword(user.get(), password.get())

            logger.lifecycle("Uploading ${jarFile.name} -> ${user.get()}@${host.get()}:${remotePath}")
            ssh.newSFTPClient().withCloseable { sftp ->
                sftp.put(new FileSystemFile(jarFile), remotePath)
            }
            logger.lifecycle('Upload complete.')
        }
    }
}
